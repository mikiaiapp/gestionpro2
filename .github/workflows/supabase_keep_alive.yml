name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 5 * * *' # Ejecutar todos los días a las 05:00 UTC
  workflow_dispatch: # Permitir ejecución manual desde la pestaña Actions

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Realizar consulta a la base de datos
        run: |
          curl -i -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/perfiles?select=id&created_at=lt.$(date -u +'%Y-%m-%dT%H:%M:%SZ')&limit=1" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Cache-Control: no-cache"
